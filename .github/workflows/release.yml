# Publishes the `getmotif` package to npm with a provenance attestation —
# the ONLY sanctioned publish path (see SECURITY.md). Trigger by pushing
# a v* tag. Requires the NPM_TOKEN repo secret (automation token, 2FA org).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # provenance (Sigstore) needs OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: tag must match the package version
        run: |
          pkg="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx tsc -b packages/core packages/cli packages/server
      - run: npx vitest run
      - run: npm run build -w @motif/ui
      - run: npm run build -w getmotif
      - name: the built binary reports the tagged version
        run: |
          got="$(node packages/cli/dist/index.js --version)"
          if [ "$got" != "${GITHUB_REF_NAME#v}" ]; then
            echo "binary reports $got but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm publish -w getmotif --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
